<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAIT Wochenplaner - Vollständige App</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg: #f4f6f9;
            --panel: #ffffff;
            --border: #e2e6ec;
            --text: #1f2733;
            --muted: #6b7686;
            --accent: #2f6bff;
            --accent-soft: #eaf0ff;
            --hour-h: 52px;
            --shadow: 0 2px 10px rgba(20, 30, 50, .08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        wochenplaner-app {
            display: block;
            height: 100vh;
            width: 100%;
        }
    </style>
</head>
<body>
    <wochenplaner-app></wochenplaner-app>

    <script>
        // Konfiguration
        const CONFIG = {
            START_HOUR: 7,
            END_HOUR: 19,
            HOUR_H: 52,
            SNAP_MIN: 15,
            DAYS: ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag"],
            COLORS: ["#2f6bff", "#e0662a", "#12a150", "#a259e6", "#e0396f", "#0d9dc4", "#c99a12", "#5b6470"]
        };

        // Utility Funktionen
        class Utils {
            static getMonday(d) {
                d = new Date(d);
                const day = (d.getDay() + 6) % 7;
                d.setDate(d.getDate() - day);
                d.setHours(0, 0, 0, 0);
                return d;
            }

            static addDays(d, n) {
                const x = new Date(d);
                x.setDate(x.getDate() + n);
                return x;
            }

            static isoDate(d) {
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                return `${y}-${m}-${dd}`;
            }

            static fmtDate(d) {
                return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
            }

            static minToTime(m) {
                const h = Math.floor(m / 60);
                const mm = m % 60;
                return String(h).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
            }

            static timeToMin(timeStr) {
                const [h, m] = timeStr.split(':').map(Number);
                return h * 60 + m;
            }

            static uid() {
                return Math.random().toString(36).slice(2, 9);
            }

            static escapeHtml(s) {
                return String(s).replace(/[&<>"']/g, c => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                }[c]));
            }
        }

        // Hauptkomponente
        class WochenplanerApp extends HTMLElement {
            constructor() {
                super();
                this.attachShadow({ mode: 'open' });
                this.currentMonday = Utils.getMonday(new Date());
                this.projects = [];
                this.events = [];
                this.history = [];
                this.currentHistoryIndex = -1;
                this.selectedItem = null;
            }

            connectedCallback() {
                this.loadData();
                this.render();
                this.setupEventListeners();
            }

            loadData() {
                try {
                    const saved = localStorage.getItem('wochenplan_data');
                    if (saved) {
                        const data = JSON.parse(saved);
                        this.projects = data.projects || [];
                        this.events = data.events || [];
                        this.currentMonday = new Date(data.currentMonday || Utils.getMonday(new Date()));
                    } else {
                        this.projects = [{
                            id: Utils.uid(),
                            name: "Beispielprojekt",
                            color: CONFIG.COLORS[0],
                            tasks: [
                                { id: Utils.uid(), name: "Konzept erstellen" },
                                { id: Utils.uid(), name: "Abstimmung Team" }
                            ]
                        }];
                        this.events = [];
                    }
                } catch (error) {
                    console.error("Fehler beim Laden der Daten:", error);
                    this.showNotification("Fehler beim Laden der Daten");
                }
            }

            saveData() {
                try {
                    const data = {
                        projects: this.projects,
                        events: this.events,
                        currentMonday: this.currentMonday.toISOString()
                    };
                    localStorage.setItem('wochenplan_data', JSON.stringify(data));
                } catch (error) {
                    console.error("Fehler beim Speichern der Daten:", error);
                    this.showNotification("Fehler beim Speichern der Daten");
                }
            }

            render() {
                this.shadowRoot.innerHTML = `
                    <style>
                        :host {
                            display: flex;
                            flex-direction: column;
                            height: 100%;
                            background: var(--bg);
                        }

                        header {
                            display: flex;
                            align-items: center;
                            justify-content: space-between;
                            padding: 12px 20px;
                            background: var(--panel);
                            border-bottom: 1px solid var(--border);
                            box-shadow: var(--shadow);
                            gap: 16px;
                            flex-wrap: wrap;
                        }

                        header h1 {
                            font-size: 18px;
                            font-weight: 600;
                            display: flex;
                            align-items: center;
                            gap: 10px;
                        }

                        header h1 .dot {
                            width: 10px;
                            height: 10px;
                            border-radius: 50%;
                            background: var(--accent);
                        }

                        .toolbar {
                            display: flex;
                            align-items: center;
                            gap: 10px;
                            flex-wrap: wrap;
                        }

                        button {
                            border: 1px solid var(--border);
                            background: #fff;
                            border-radius: 8px;
                            padding: 7px 12px;
                            cursor: pointer;
                            font-size: 14px;
                            transition: .15s;
                        }

                        button:hover {
                            background: var(--accent-soft);
                            border-color: var(--accent);
                        }

                        .btn-primary {
                            background: var(--accent);
                            color: #fff;
                            border-color: var(--accent);
                        }

                        .btn-primary:hover {
                            background: #2559d8;
                        }

                        .week-label {
                            font-weight: 600;
                            min-width: 210px;
                            text-align: center;
                            font-size: 14px;
                        }

                        .layout {
                            display: flex;
                            flex: 1;
                            overflow: hidden;
                        }

                        .sidebar {
                            width: 330px;
                            background: var(--panel);
                            border-left: 1px solid var(--border);
                            display: flex;
                            flex-direction: column;
                            overflow: hidden;
                        }

                        .sidebar-header {
                            padding: 14px 16px;
                            border-bottom: 1px solid var(--border);
                            display: flex;
                            justify-content: space-between;
                            align-items: center;
                        }

                        .projects {
                            flex: 1;
                            overflow: auto;
                            padding: 12px;
                        }

                        .project {
                            border: 1px solid var(--border);
                            border-radius: 10px;
                            margin-bottom: 12px;
                            overflow: hidden;
                        }

                        .project-head {
                            display: flex;
                            align-items: center;
                            gap: 8px;
                            padding: 10px 12px;
                            background: #fafbfd;
                            font-weight: 600;
                            font-size: 14px;
                        }

                        .project-head .color-tag {
                            width: 14px;
                            height: 14px;
                            border-radius: 4px;
                            flex-shrink: 0;
                            cursor: pointer;
                        }

                        .project-head .p-name {
                            flex: 1;
                            outline: none;
                            border: none;
                            background: transparent;
                            font-weight: 600;
                            font-size: 14px;
                            padding: 2px 4px;
                        }

                        .project-head .p-actions {
                            display: flex;
                            gap: 4px;
                        }

                        .project-head button {
                            padding: 2px 6px;
                            font-size: 14px;
                            background: none;
                            border: none;
                            cursor: pointer;
                        }

                        .tasks {
                            padding: 6px 10px 10px;
                        }

                        .task {
                            display: flex;
                            align-items: center;
                            gap: 8px;
                            padding: 8px 10px;
                            margin: 6px 0;
                            border-radius: 8px;
                            cursor: grab;
                            font-size: 13px;
                            color: #fff;
                            box-shadow: var(--shadow);
                            position: relative;
                        }

                        .task .t-name {
                            flex: 1;
                            outline: none;
                            border: none;
                            background: transparent;
                            color: #fff;
                            font-size: 13px;
                            padding: 2px 4px;
                        }

                        .task .badge {
                            position: absolute;
                            top: -6px;
                            right: -6px;
                            background: #fff;
                            color: var(--muted);
                            border: 1px solid var(--border);
                            border-radius: 10px;
                            font-size: 10px;
                            padding: 1px 5px;
                            font-weight: 600;
                        }

                        .calendar-wrap {
                            flex: 1;
                            overflow: auto;
                            background: var(--panel);
                        }

                        .calendar {
                            display: grid;
                            grid-template-columns: 60px repeat(5, 1fr);
                            min-width: 760px;
                        }

                        .cal-head .cell {
                            position: sticky;
                            top: 0;
                            z-index: 3;
                            background: var(--panel);
                            padding: 10px 6px;
                            text-align: center;
                            border-right: 1px solid var(--border);
                            border-bottom: 2px solid var(--border);
                            font-weight: 600;
                            font-size: 13px;
                        }

                        .cal-head .cell small {
                            display: block;
                            color: var(--muted);
                            font-weight: 400;
                            font-size: 11px;
                            margin-top: 2px;
                        }

                        .corner {
                            position: sticky;
                            top: 0;
                            z-index: 3;
                            background: var(--panel);
                            border-bottom: 2px solid var(--border);
                        }

                        .time-col .time-cell {
                            height: var(--hour-h);
                            border-right: 1px solid var(--border);
                            border-bottom: 1px solid var(--border);
                            font-size: 11px;
                            color: var(--muted);
                            text-align: right;
                            padding: 2px 6px;
                        }

                        .day-col {
                            position: relative;
                            border-right: 1px solid var(--border);
                        }

                        .hour-slot {
                            height: var(--hour-h);
                            border-bottom: 1px solid var(--border);
                            position: relative;
                        }

                        .event {
                            position: absolute;
                            left: 4px;
                            right: 4px;
                            border-radius: 8px;
                            padding: 6px 8px;
                            color: #fff;
                            font-size: 12px;
                            overflow: hidden;
                            cursor: grab;
                            box-shadow: var(--shadow);
                            z-index: 2;
                            user-select: none;
                            border: 1px solid rgba(255, 255, 255, .25);
                        }

                        .event .ev-title {
                            font-weight: 600;
                            line-height: 1.2;
                        }

                        .event .ev-time {
                            font-size: 10px;
                            opacity: .9;
                            margin-top: 2px;
                        }

                        .event .ev-del {
                            position: absolute;
                            top: 3px;
                            right: 5px;
                            cursor: pointer;
                            font-size: 13px;
                            line-height: 1;
                            opacity: 0;
                            transition: .15s;
                        }

                        .event:hover .ev-del {
                            opacity: 1;
                        }

                        .notification {
                            position: fixed;
                            top: 20px;
                            right: 20px;
                            background: var(--panel);
                            border: 1px solid var(--border);
                            border-radius: 8px;
                            padding: 12px 16px;
                            box-shadow: var(--shadow);
                            z-index: 100;
                            display: none;
                        }

                        .notification.show {
                            display: block;
                        }
                    </style>

                    <header>
                        <h1><span class="dot"></span> MAIT Wochenplan</h1>
                        <div class="toolbar">
                            <button id="importBtn" class="btn-primary">⭳ Excel/TXT importieren</button>
                            <input type="file" id="fileInput" accept=".xlsx,.xls,.csv,.txt" style="display:none">
                            <button id="prevWeek">‹ Vorige</button>
                            <span class="week-label" id="weekLabel"></span>
                            <button id="nextWeek">Nächste ›</button>
                            <button id="todayBtn">Heute</button>
                            <button id="exportWeek" class="btn-primary">📋 Woche exportieren</button>
                            <button id="clearEvents">🗑 Termine leeren</button>
                        </div>
                    </header>

                    <div class="layout">
                        <div class="sidebar">
                            <div class="sidebar-header">
                                <h2 style="margin: 0; font-size: 15px;">📋 Projekte</h2>
                                <button id="addProject" style="padding: 6px 10px; background: var(--accent); color: #fff; border: none;">+ Projekt</button>
                            </div>
                            <div class="projects" id="projects"></div>
                        </div>

                        <div class="calendar-wrap">
                            <div class="calendar" id="calendar"></div>
                        </div>
                    </div>

                    <div class="notification" id="notification">
                        <span id="notificationText"></span>
                    </div>
                `;

                // Nach dem Rendern: Kalender, Projekte, Labels aktualisieren
                this.updateCalendar();
                this.updateProjects();
                this.updateWeekLabel();
            }

            updateCalendar() {
                const cal = this.shadowRoot.getElementById('calendar');
                cal.innerHTML = '';

                const todayISO = Utils.isoDate(new Date());
                const corner = document.createElement('div');
                corner.className = 'corner';
                cal.appendChild(corner);

                const dayDates = [];
                for (let i = 0; i < 5; i++) {
                    const d = Utils.addDays(this.currentMonday, i);
                    dayDates.push(d);
                    const wrap = document.createElement('div');
                    wrap.className = 'cal-head';
                    const c = document.createElement('div');
                    c.className = 'cell';
                    c.innerHTML = CONFIG.DAYS[i] + '<small>' + Utils.fmtDate(d) + '</small>';
                    wrap.appendChild(c);
                    cal.appendChild(wrap);
                }

                const timeCol = document.createElement('div');
                timeCol.className = 'time-col';
                for (let h = CONFIG.START_HOUR; h < CONFIG.END_HOUR; h++) {
                    const t = document.createElement('div');
                    t.className = 'time-cell';
                    t.textContent = String(h).padStart(2, '0') + ':00';
                    timeCol.appendChild(t);
                }
                cal.appendChild(timeCol);

                dayDates.forEach((d, dayIndex) => {
                    const col = document.createElement('div');
                    col.className = 'day-col';
                    col.dataset.date = Utils.isoDate(d);
                    for (let h = CONFIG.START_HOUR; h < CONFIG.END_HOUR; h++) {
                        const slot = document.createElement('div');
                        slot.className = 'hour-slot';
                        col.appendChild(slot);
                    }
                    cal.appendChild(col);

                    // Events hinzufügen
                    this.events.forEach(ev => {
                        if (ev.dateISO === col.dataset.date) {
                            const el = document.createElement('div');
                            el.className = 'event';
                            el.style.background = ev.color;
                            el.style.top = ((ev.startMin - CONFIG.START_HOUR * 60) / 60 * CONFIG.HOUR_H) + 'px';
                            el.style.height = (ev.durMin / 60 * CONFIG.HOUR_H) + 'px';
                            el.dataset.id = ev.id;
                            el.innerHTML = `
                                <span class="ev-del" title="Löschen">✕</span>
                                <div class="ev-title">${Utils.escapeHtml(ev.title)}</div>
                                <div class="ev-time">${Utils.minToTime(ev.startMin)}–${Utils.minToTime(ev.startMin + ev.durMin)}</div>
                            `;
                            el.querySelector('.ev-del').addEventListener('click', (e) => {
                                e.stopPropagation();
                                this.events = this.events.filter(x => x.id !== ev.id);
                                this.saveData();
                                this.updateCalendar();
                            });
                            col.appendChild(el);
                        }
                    });
                });
            }

            updateProjects() {
                const wrap = this.shadowRoot.getElementById('projects');
                wrap.innerHTML = '';
                this.projects.forEach(p => {
                    const box = document.createElement('div');
                    box.className = 'project';
                    box.dataset.id = p.id;

                    const head = document.createElement('div');
                    head.className = 'project-head';
                    head.innerHTML = `
                        <span class="color-tag" style="background:${p.color}" title="Farbe ändern"></span>
                        <input class="p-name" type="text" value="${Utils.escapeHtml(p.name)}" title="Projekt umbenennen">
                        <div class="p-actions">
                            <button class="p-add" title="Aufgabe hinzufügen">＋</button>
                            <button class="p-del" title="Projekt löschen">🗑</button>
                        </div>
                    `;

                    const nameInput = head.querySelector('.p-name');
                    nameInput.addEventListener('blur', e => {
                        p.name = e.target.value.trim() || 'Projekt';
                        this.saveData();
                        this.updateProjects();
                    });

                    head.querySelector('.color-tag').addEventListener('click', () => {
                        const i = CONFIG.COLORS.indexOf(p.color);
                        p.color = CONFIG.COLORS[(i + 1) % CONFIG.COLORS.length];
                        this.events.forEach(ev => {
                            if (ev.projectId === p.id) {
                                ev.color = p.color;
                            }
                        });
                        this.saveData();
                        this.updateProjects();
                        this.updateCalendar();
                    });

                    head.querySelector('.p-add').addEventListener('click', () => {
                        p.tasks.push({ id: Utils.uid(), name: "Neue Aufgabe" });
                        this.saveData();
                        this.updateProjects();
                    });

                    head.querySelector('.p-del').addEventListener('click', () => {
                        const eventCount = this.events.filter(ev => ev.projectId === p.id).length;
                        const taskCount = p.tasks.length;
                        if (confirm(`Projekt "${p.name}" löschen?\n\n${eventCount} Termine und ${taskCount} Aufgaben werden gelöscht.`)) {
                            this.events = this.events.filter(ev => ev.projectId !== p.id);
                            this.projects = this.projects.filter(x => x.id !== p.id);
                            this.saveData();
                            this.updateProjects();
                            this.updateCalendar();
                        }
                    });

                    box.appendChild(head);

                    const tasksDiv = document.createElement('div');
                    tasksDiv.className = 'tasks';
                    if (p.tasks.length === 0) {
                        const em = document.createElement('div');
                        em.style.cssText = 'font-size: 12px; color: var(--muted); padding: 6px 4px; font-style: italic;';
                        em.textContent = 'Keine Aufgaben – ＋ oder Termin hierher ziehen';
                        tasksDiv.appendChild(em);
                    }

                    p.tasks.forEach(t => {
                        const tEl = document.createElement('div');
                        tEl.className = 'task';
                        tEl.style.background = p.color;
                        tEl.draggable = true;
                        tEl.dataset.id = t.id;
                        tEl.dataset.type = 'task';

                        const occurrences = this.countTaskOccurrences(t.id);
                        if (occurrences > 1) {
                            tEl.innerHTML = `
                                <span style="opacity: .7; font-size: 13px;">⠿</span>
                                <input class="t-name" type="text" value="${Utils.escapeHtml(t.name)}" title="Aufgabe umbenennen">
                                <button style="background: none; border: none; color: #fff; opacity: .7; font-size: 14px; cursor: pointer;" class="t-del" title="Löschen">✕</button>
                                <span class="badge">${occurrences}×</span>
                            `;
                        } else {
                            tEl.innerHTML = `
                                <span style="opacity: .7; font-size: 13px;">⠿</span>
                                <input class="t-name" type="text" value="${Utils.escapeHtml(t.name)}" title="Aufgabe umbenennen">
                                <button style="background: none; border: none; color: #fff; opacity: .7; font-size: 14px; cursor: pointer;" class="t-del" title="Löschen">✕</button>
                            `;
                        }

                        const taskNameInput = tEl.querySelector('.t-name');
                        taskNameInput.addEventListener('blur', e => {
                            t.name = e.target.value.trim() || 'Aufgabe';
                            this.saveData();
                            this.updateProjects();
                        });

                        tEl.querySelector('.t-del').addEventListener('click', (e) => {
                            e.stopPropagation();
                            p.tasks = p.tasks.filter(x => x.id !== t.id);
                            this.events = this.events.filter(ev => ev.taskId !== t.id);
                            this.saveData();
                            this.updateProjects();
                            this.updateCalendar();
                        });

                        tEl.addEventListener('dragstart', e => {
                            e.dataTransfer.setData('application/json', JSON.stringify({
                                name: t.name,
                                color: p.color,
                                type: 'task',
                                id: t.id,
                                projectId: p.id
                            }));
                            e.dataTransfer.effectAllowed = 'copy';
                        });

                        tasksDiv.appendChild(tEl);
                    });

                    box.appendChild(tasksDiv);
                    wrap.appendChild(box);
                });
            }

            countTaskOccurrences(taskId) {
                let count = 0;
                const currentWeekStart = Utils.getMonday(this.currentMonday);
                const prevWeekStart = Utils.addDays(currentWeekStart, -7);
                const nextWeekStart = Utils.addDays(currentWeekStart, 7);

                for (let i = 0; i < 5; i++) {
                    const dateISO = Utils.isoDate(Utils.addDays(currentWeekStart, i));
                    if (this.events.some(ev => ev.taskId === taskId && ev.dateISO === dateISO)) count++;
                }

                for (let i = 0; i < 5; i++) {
                    const dateISO = Utils.isoDate(Utils.addDays(prevWeekStart, i));
                    if (this.events.some(ev => ev.taskId === taskId && ev.dateISO === dateISO)) count++;
                }

                for (let i = 0; i < 5; i++) {
                    const dateISO = Utils.isoDate(Utils.addDays(nextWeekStart, i));
                    if (this.events.some(ev => ev.taskId === taskId && ev.dateISO === dateISO)) count++;
                }

                return count;
            }

            updateWeekLabel() {
                const end = Utils.addDays(this.currentMonday, 4);
                const label = this.shadowRoot.getElementById('weekLabel');
                if (label) {
                    label.textContent = Utils.fmtDate(this.currentMonday) + ' – ' + Utils.fmtDate(end) + '.' + this.currentMonday.getFullYear();
                }
            }

            setupEventListeners() {
                const importBtn = this.shadowRoot.getElementById('importBtn');
                const fileInput = this.shadowRoot.getElementById('fileInput');
                const prevBtn = this.shadowRoot.getElementById('prevWeek');
                const nextBtn = this.shadowRoot.getElementById('nextWeek');
                const todayBtn = this.shadowRoot.getElementById('todayBtn');
                const exportBtn = this.shadowRoot.getElementById('exportWeek');
                const clearBtn = this.shadowRoot.getElementById('clearEvents');
                const addProjectBtn = this.shadowRoot.getElementById('addProject');

                if (importBtn) importBtn.addEventListener('click', () => fileInput.click());
                if (fileInput) fileInput.addEventListener('change', (e) => this.handleFileUpload(e));
                if (prevBtn) prevBtn.addEventListener('click', () => {
                    this.currentMonday = Utils.addDays(this.currentMonday, -7);
                    this.saveData();
                    this.updateCalendar();
                    this.updateWeekLabel();
                });
                if (nextBtn) nextBtn.addEventListener('click', () => {
                    this.currentMonday = Utils.addDays(this.currentMonday, 7);
                    this.saveData();
                    this.updateCalendar();
                    this.updateWeekLabel();
                });
                if (todayBtn) todayBtn.addEventListener('click', () => {
                    this.currentMonday = Utils.getMonday(new Date());
                    this.saveData();
                    this.updateCalendar();
                    this.updateWeekLabel();
                });
                if (exportBtn) exportBtn.addEventListener('click', () => this.exportWeek());
                if (clearBtn) clearBtn.addEventListener('click', () => {
                    if (confirm('Alle Termine im Kalender löschen?')) {
                        this.events = [];
                        this.saveData();
                        this.updateCalendar();
                    }
                });
                if (addProjectBtn) addProjectBtn.addEventListener('click', () => {
                    this.projects.push({
                        id: Utils.uid(),
                        name: "Neues Projekt",
                        color: CONFIG.COLORS[this.projects.length % CONFIG.COLORS.length],
                        tasks: []
                    });
                    this.saveData();
                    this.updateProjects();
                });

                // Drag & Drop Setup für Kalender
                const calendarWrap = this.shadowRoot.querySelector('.calendar-wrap');
                if (calendarWrap) {
                    document.addEventListener('dragover', (e) => {
                        e.preventDefault();
                    });

                    this.shadowRoot.addEventListener('dragover', (e) => {
                        e.preventDefault();
                    });

                    this.shadowRoot.addEventListener('drop', (e) => {
                        e.preventDefault();
                        const data = e.dataTransfer.getData('application/json');
                        if (!data) return;
                        const { name, color, type, id, projectId } = JSON.parse(data);

                        if (type === 'task') {
                            const rect = calendarWrap.getBoundingClientRect();
                            const y = e.clientY - rect.top;
                            const colWidth = rect.width / 5;
                            const dayIndex = Math.floor((e.clientX - rect.left) / colWidth);

                            if (dayIndex >= 0 && dayIndex < 5) {
                                const d = Utils.addDays(this.currentMonday, dayIndex);
                                let startMin = CONFIG.START_HOUR * 60 + Math.round((y / CONFIG.HOUR_H * 60) / CONFIG.SNAP_MIN) * CONFIG.SNAP_MIN;
                                startMin = Math.max(CONFIG.START_HOUR * 60, Math.min(startMin, CONFIG.END_HOUR * 60 - 60));

                                this.events.push({
                                    id: Utils.uid(),
                                    title: name,
                                    color: color || CONFIG.COLORS[0],
                                    dateISO: Utils.isoDate(d),
                                    startMin,
                                    durMin: 60,
                                    taskId: id,
                                    projectId: projectId
                                });

                                this.saveData();
                                this.updateCalendar();
                                this.showNotification('Aufgabe in den Kalender geplant');
                            }
                        }
                    });
                }
            }

            handleFileUpload(e) {
                const file = e.target.files[0];
                if (!file) return;
                const isTxt = file.name.toLowerCase().endsWith('.txt');
                const reader = new FileReader();
                reader.onload = (ev) => {
                    if (isTxt) {
                        this.handleTxtImport(ev.target.result);
                    } else {
                        this.handleExcelImport(new Uint8Array(ev.target.result));
                    }
                };
                if (isTxt) {
                    reader.readAsText(file);
                } else {
                    reader.readAsArrayBuffer(file);
                }
                e.target.value = '';
            }

            handleTxtImport(txt) {
                const lines = txt.trim().split('\n').filter(l => l.trim());
                if (lines.length === 0) {
                    this.showNotification('Keine Zeilen in der Datei gefunden');
                    return;
                }

                let imported = 0, skipped = 0;
                let firstDate = null;

                lines.forEach(line => {
                    const parts = line.split('|').map(p => p.trim());
                    if (parts.length >= 3) {
                        const title = parts[0];
                        const startDate = new Date(parts[1]);
                        const startTime = Utils.timeToMin(parts[2]);

                        if (!isNaN(startDate.getTime())) {
                            const dow = (startDate.getDay() + 6) % 7;
                            if (dow < 5) {
                                this.events.push({
                                    id: Utils.uid(),
                                    title: title,
                                    color: CONFIG.COLORS[imported % CONFIG.COLORS.length],
                                    dateISO: Utils.isoDate(startDate),
                                    startMin: startTime,
                                    durMin: 60
                                });

                                if (!firstDate || startDate < firstDate) firstDate = startDate;
                                imported++;
                            } else {
                                skipped++;
                            }
                        }
                    }
                });

                if (firstDate) {
                    this.currentMonday = Utils.getMonday(firstDate);
                }

                this.saveData();
                this.updateCalendar();
                this.updateWeekLabel();
                this.showNotification(`${imported} Termine importiert.` + (skipped ? ` ${skipped} übersprungen.` : ''));
            }

            handleExcelImport(data) {
                const wb = XLSX.read(data, { type: 'array', cellDates: true });
                const ws = wb.Sheets[wb.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(ws, { defval: '', raw: false });

                if (rows.length === 0) {
                    this.showNotification('Keine Zeilen in der Datei gefunden');
                    return;
                }

                let imported = 0, skipped = 0;
                let firstDate = null;

                rows.forEach(row => {
                    const title = Object.values(row)[0] || 'Termin';
                    const dateStr = Object.values(row)[1];
                    const timeStr = Object.values(row)[2];

                    if (dateStr) {
                        const startDate = new Date(dateStr);
                        if (!isNaN(startDate.getTime())) {
                            const dow = (startDate.getDay() + 6) % 7;
                            if (dow < 5) {
                                const startMin = timeStr ? Utils.timeToMin(timeStr) : CONFIG.START_HOUR * 60 + 60;

                                this.events.push({
                                    id: Utils.uid(),
                                    title: title,
                                    color: CONFIG.COLORS[imported % CONFIG.COLORS.length],
                                    dateISO: Utils.isoDate(startDate),
                                    startMin: startMin,
                                    durMin: 60
                                });

                                if (!firstDate || startDate < firstDate) firstDate = startDate;
                                imported++;
                            } else {
                                skipped++;
                            }
                        }
                    }
                });

                if (firstDate) {
                    this.currentMonday = Utils.getMonday(firstDate);
                }

                this.saveData();
                this.updateCalendar();
                this.updateWeekLabel();
                this.showNotification(`${imported} Termine importiert.` + (skipped ? ` ${skipped} übersprungen.` : ''));
            }

            exportWeek() {
                let text = '';
                const weekStart = this.currentMonday;
                const weekEnd = Utils.addDays(this.currentMonday, 4);
                text += `WOCHENPLAN ${Utils.fmtDate(weekStart)} – ${Utils.fmtDate(weekEnd)}\n`;
                text += '='.repeat(50) + '\n\n';

                for (let i = 0; i < 5; i++) {
                    const d = Utils.addDays(this.currentMonday, i);
                    const dateISO = Utils.isoDate(d);
                    const dayEvents = this.events.filter(ev => ev.dateISO === dateISO).sort((a, b) => a.startMin - b.startMin);

                    text += CONFIG.DAYS[i] + '\n';
                    if (dayEvents.length === 0) {
                        text += '  (keine Termine)\n';
                    } else {
                        dayEvents.forEach(ev => {
                            const hours = Math.round(ev.durMin / 60 * 10) / 10;
                            const hourStr = hours % 1 === 0 ? hours.toFixed(0) : hours.toFixed(1);
                            text += `  • ${ev.title} (${hourStr} Std.)\n`;
                        });
                    }
                    text += '\n';
                }

                const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `wochenplan_${Utils.fmtDate(weekStart).replace(/\./g, '-')}.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                this.showNotification('Woche erfolgreich exportiert!');
            }

            showNotification(message) {
                const notification = this.shadowRoot.getElementById('notification');
                if (notification) {
                    const text = this.shadowRoot.getElementById('notificationText');
                    if (text) text.textContent = message;
                    notification.classList.add('show');
                    setTimeout(() => {
                        notification.classList.remove('show');
                    }, 3000);
                }
            }
        }

        // WebComponent registrieren
        customElements.define('wochenplaner-app', WochenplanerApp);
    </script>
</body>
</html>
